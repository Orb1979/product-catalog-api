spring.application.name=catalog-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/catalog}
spring.datasource.username=${DB_USER:catalog}
spring.datasource.password=${DB_PASSWORD:catalog}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

pricing.base-url=${PRICING_BASE_URL:http://localhost:8081}
pricing.sync-interval=${PRICING_SYNC_INTERVAL:5s}
pricing.enabled=${PRICING_ENABLED:true}
