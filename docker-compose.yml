services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${DB_USER:-catalog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catalog}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-pricing:
    build:
      context: .
      dockerfile: mock-pricing-system/Dockerfile
    ports:
      - "127.0.0.1:${MOCK_PRICING_PORT:-8081}:8081"
    environment:
      PRICING_CHANGE_INTERVAL: ${PRICING_CHANGE_INTERVAL:-5s}

volumes:
  catalog-data:
