services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${DB_USER:-catalog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catalog}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-pricing:
    build:
      context: .
      dockerfile: mock-pricing-system/Dockerfile
    ports:
      - "127.0.0.1:${MOCK_PRICING_PORT:-8081}:8081"
    environment:
      PRICING_CHANGE_INTERVAL: ${PRICING_CHANGE_INTERVAL:-5s}


    build:
      context: .
      dockerfile: catalog-api/Dockerfile
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/catalog
      DB_USER: ${DB_USER:-catalog}
      DB_PASSWORD: ${DB_PASSWORD:-catalog}
      PRICING_BASE_URL: http://mock-pricing:8081
      PRICING_SYNC_INTERVAL: ${PRICING_SYNC_INTERVAL:-5s}
      PRICING_ENABLED: ${PRICING_ENABLED:-true}
      PRICING_CONNECT_TIMEOUT: ${PRICING_CONNECT_TIMEOUT:-1s}
      PRICING_READ_TIMEOUT: ${PRICING_READ_TIMEOUT:-2s}
      PRICING_RETRY_DELAY: ${PRICING_RETRY_DELAY:-200ms}
      PRICING_CIRCUIT_OPEN_DURATION: ${PRICING_CIRCUIT_OPEN_DURATION:-30s}
    depends_on:
      postgres:
        condition: service_healthy
      mock-pricing:
        condition: service_started

volumes:
  catalog-data:
